name: Reference Link Check (manual, read-only)
on:
  workflow_dispatch:
    inputs:
      candidates:
        description: "Optional JSON file of proposed replacement URLs ({url, expect[]}); empty checks every cited reference"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch every outbound reference cited on published pages and classify the answer
        env:
          CANDIDATES: ${{ inputs.candidates }}
        run: |
          if [ -n "$CANDIDATES" ]; then
            node scripts/seo/reference-link-check.mjs --confirm-live --candidates="$CANDIDATES"
          else
            node scripts/seo/reference-link-check.mjs --confirm-live
          fi
      - name: Store evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-reference-links
          path: |
            reports/reference-links.json
            reports/reference-candidates.json
          if-no-files-found: ignore
          retention-days: 30
