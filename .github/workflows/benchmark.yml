name: Global Search Metadata Benchmark (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synthetic 10k and 40k search metadata benchmark
        run: |
          mkdir -p reports
          node scripts/bench/search-scale.mjs | tee reports/search-scale-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: global-search-scale-benchmark
          path: reports/search-scale-benchmark.json
          retention-days: 14
