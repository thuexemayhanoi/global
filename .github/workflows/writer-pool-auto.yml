name: Global Dynamic Writer Autopilot
run-name: "Auto claim/submit from ${{ github.event.workflow_run.head_branch }}"
on:
  workflow_run:
    workflows: ["External Writer Draft QA (read-only)"]
    types: [completed]
permissions:
  contents: write
  pull-requests: read
  checks: read
concurrency:
  group: global-dynamic-writer-pool
  cancel-in-progress: false
jobs:
  coordinate:
    # Only same-repo successful PUSH QA is trusted. PR QA doesn't reserve IDs.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (startsWith(github.event.workflow_run.head_branch, 'writer/w1-') ||
       startsWith(github.event.workflow_run.head_branch, 'writer/w2-') ||
       startsWith(github.event.workflow_run.head_branch, 'writer/w3-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate only trusted main code and protected legacy content
        run: |
          node --check scripts/writer-pool-auto.mjs
          node --check scripts/writer-request.mjs
          node --test tests/writer-pool.test.mjs tests/writer-pool-auto.test.mjs tests/writer-refill.test.mjs
          node scripts/build.mjs --check
      - name: Auto-submit verified 1–10 drafts and refill Writer queue (no manual button)
        env:
          WRITER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GREEN_COMMIT: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/writer-pool-auto.mjs --branch "$WRITER_BRANCH" --sha "$GREEN_COMMIT"
      - name: Commit only centralized claims ledger (three safe CAS retries)
        env:
          WRITER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GREEN_COMMIT: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "global-writer-autopilot"
          git config user.email "global-writer-autopilot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add factory/external-writers/claims.json
            if git diff --cached --quiet; then
              echo "No further ledger change required (idempotent / unfinished / stale)."
              exit 0
            fi
            git commit -m "pool(global): record verified Writer drafts and refill slot"
            git fetch --no-tags origin main
            if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD^)" ] && git push origin HEAD:main; then
              echo "Turbo claims committed safely to latest main."
              exit 0
            fi
            echo "CONCURRENT_MAIN_UPDATE attempt=$attempt: re-read freshest main and recompute, never force push"
            git fetch --no-tags origin main
            git reset --hard origin/main
            node scripts/writer-pool-auto.mjs --branch "$WRITER_BRANCH" --sha "$GREEN_COMMIT"
          done
          echo "SAFE_STOP: retry budget exhausted, remote draft remains intact; re-push/nudge same Writer branch after recovery."
          exit 1
