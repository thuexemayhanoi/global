name: Temporary refresh Global topical graph 2026-10-15
on:
  push:
    branches:
      - feature/global-open-six-domain-research-20261015
    paths:
      - '.github/workflows/temp-refresh-global-graph-20261015.yml'
permissions:
  contents: write
concurrency:
  group: temporary-global-topical-graph-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-open-six-domain-research-20261015
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and validate deterministic graph without changing published content
        run: |
          set -euo pipefail
          node scripts/seo/content-graph.mjs --write
          node scripts/seo/content-graph.mjs --check
          node --test tests/topic-factory.test.mjs tests/topical-authority.test.mjs
          node scripts/seo/validate-plan.mjs
          git status --porcelain
          changed="$(git status --porcelain | awk '{print $2}')"
          if [ -n "$changed" ] && echo "$changed" | grep -Ev '^(data/seo/content-graph.json|docs/GLOBAL-SITE-MATRIX.md)$'; then
            echo 'Refusing changes outside the two generated SEO graph artifacts'
            exit 1
          fi
      - name: Commit only the two generated graph artifacts to feature branch
        run: |
          set -euo pipefail
          git config user.name "global-topical-graph-sync"
          git config user.email "global-topical-graph-sync@users.noreply.github.com"
          git add data/seo/content-graph.json docs/GLOBAL-SITE-MATRIX.md
          if git diff --cached --quiet; then
            echo "No graph changes required"
            exit 0
          fi
          git commit -m "factory(global): sync deterministic graph for six research domains"
          git fetch origin feature/global-open-six-domain-research-20261015
          test "$(git rev-parse origin/feature/global-open-six-domain-research-20261015)" = "$(git rev-parse HEAD^)"
          git push origin HEAD:feature/global-open-six-domain-research-20261015
