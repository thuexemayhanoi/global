name: Editorial Review QA
run-name: "Editorial review QA ${{ github.ref_name }}"
on:
  push:
    branches: ['review/**']
    paths: ['factory/editorial-reviews/**']
  pull_request:
    branches: [main]
    paths: ['factory/editorial-reviews/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate independent AI editorial reviews (hash-bound, never human-claimed; read-only)
        run: node scripts/auto-publisher.mjs validate-reviews
