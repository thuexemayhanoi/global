name: One-time SEO Matrix independent-strategy reconciliation
on:
  push:
    branches:
      - seo/az-sync-independent-20261028
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/az-sync-independent-20261028
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing audit-toolkit dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml openpyxl
      - name: Refresh all audit exports and original 16-sheet workbook
        run: |
          cp reports/seo/GLOBAL-SEO-AZ-MASTER-MATRIX.xlsx /tmp/global-seo-az-old.xlsx
          python docs/seo-audit/tools/collect.py
          python docs/seo-audit/tools/analyze.py
          python docs/seo-audit/tools/build_workbook.py --carry /tmp/global-seo-az-old.xlsx
          python docs/seo-audit/tools/check_owner_strategy.py
      - name: Commit and push only refreshed audit data and Excel
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/seo/data/audit-data.json reports/seo/data/analysis.json reports/seo/data/*.csv reports/seo/GLOBAL-SEO-AZ-MASTER-MATRIX.xlsx
          if git diff --cached --quiet; then
            echo "Audit exports already synchronized"
            exit 0
          fi
          git commit -m "reports(seo): regenerate 16-sheet Excel and active tasks under independent strategy"
          git push origin HEAD:refs/heads/seo/az-sync-independent-20261028
