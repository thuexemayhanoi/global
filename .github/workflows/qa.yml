name: Static SEO QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generated pages and metadata
        run: node scripts/build.mjs --check
      - name: Dynamic Writer Pool CLI smoke checks (read only)
        run: |
          node --check scripts/writer-pool.mjs
          node --check scripts/writer-pool-core.mjs
          node --check scripts/writer-pool-auto.mjs
          node --check scripts/writer-request.mjs
          node --check scripts/writer-refill.mjs
          node --check scripts/writer-repair.mjs
          node --check scripts/repair-queue-core.mjs
          node --check scripts/publisher-live-qa.mjs
          node --check scripts/topic-research.mjs
          node --check scripts/topic-research-core.mjs
          node scripts/writer-repair.mjs queue > /dev/null
          node scripts/writer-refill.mjs status
          node scripts/writer-pool.mjs status
          node scripts/writer-pool.mjs slots
          node scripts/continuous-writer.mjs status
      - name: Verify deterministic content graph
        run: node scripts/seo/content-graph.mjs --check
      - name: Premium SEO, navigation, search and accessibility regression
        run: node --test tests/ultra.test.mjs tests/premium.test.mjs tests/claims.test.mjs tests/external-writers.test.mjs tests/continuous-writer.test.mjs tests/writer-pool.test.mjs tests/writer-pool-auto.test.mjs tests/writer-refill.test.mjs tests/sitemaps.test.mjs tests/search-index.test.mjs tests/markdown-import.test.mjs tests/post-publish.test.mjs tests/seo-guard.test.mjs tests/topical-authority.test.mjs tests/fact-guard.test.mjs tests/content-graph.test.mjs tests/article-links.test.mjs tests/topic-factory.test.mjs tests/writer-slots.test.mjs tests/auto-publisher.test.mjs tests/publisher-drain.test.mjs tests/repair-queue.test.mjs tests/live-qa.test.mjs tests/writer-qa-lock.test.mjs tests/workflow-scenarios.test.mjs tests/no-ai-api.test.mjs tests/dashboard.test.mjs tests/topic-research-core.test.mjs tests/seo-v10.test.mjs tests/seo-site-qa.test.mjs
      - name: Topic Research crash-safe checkpoint, auto push and recovery (real git, throw-away origin)
        run: node --test tests/topic-research-recovery.test.mjs
      - name: Verify CNAME and canonical outputs
        shell: bash
        run: |
          test "$(cat CNAME)" = "global.rentbikehanoi.com"
          grep -q 'https://global.rentbikehanoi.com/sitemap.xml' robots.txt
          grep -q '<html lang="de"' de/index.html
          grep -q '<html lang="ko"' ko/index.html
          grep -q '<html lang="ja"' ja/index.html
      - name: Validate SEO matrix and live URL inventory
        run: node scripts/seo/validate-plan.mjs
      - name: SEO protection guard (frozen live URLs, fingerprints, hreflang, planned-URL leaks)
        run: node scripts/seo/seo-guard.mjs
      - name: Anti-fabrication fact guard (prices, NAP, hours, business schema)
        run: node scripts/seo/fact-guard.mjs
      - name: Topic Factory status and research batch validation (read only)
        run: |
          node scripts/topic-factory.mjs status
          node scripts/topic-factory.mjs validate-batches
          node scripts/topic-factory.mjs refill
          node scripts/auto-publisher.mjs validate-reviews
      - name: Topical authority gates T1-T10 and coverage (read only)
        run: |
          node scripts/seo/topical-authority.mjs validate
          node scripts/seo/topical-authority.mjs status
      - name: Smoke test read-only German writer planning
        run: node scripts/seo/writer-queue.mjs --locale de --count 2
      - name: Validate 10-language navigation and footer
        run: node scripts/nav-qa.mjs
      - name: Read-only technical and AI Search audits
        run: |
          node scripts/seo/audit-static.mjs --out reports/technical-audit.json --fail-p0
          node scripts/seo/audit-ai-search.mjs --out reports/ai-search-audit.json
      - name: Autonomous SEO engineer (read-only QA and reports)
        run: node scripts/seo/engine.mjs --locale de --count 2
      - name: Archive audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-seo-review
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify public About and Contact and approved address
        shell: bash
        run: |
          test -f about/index.html
          test -f contact/index.html
          grep -q 'nguyentuantu8x@gmail.com' contact/index.html
          grep -q '<loc>https://global.rentbikehanoi.com/about/</loc>' sitemap-main.xml
          grep -q '<loc>https://global.rentbikehanoi.com/contact/</loc>' sitemap-main.xml
      - name: Synthetic metadata scalability smoke check (no network or HTML generation)
        run: node scripts/bench/search-scale.mjs
      - name: Full-pipeline scale smoke (300 synthetic articles in a temp copy; build + every SEO gate)
        run: node scripts/bench/full-build-scale.mjs --articles 300
      - name: Test safe article rendering and refusal gates
        run: node --test tests/content-publisher.test.mjs
