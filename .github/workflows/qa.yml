name: Static SEO QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generated pages and metadata
        run: node scripts/build.mjs --check
      - name: Verify deterministic content graph
        run: node scripts/seo/content-graph.mjs --check
      - name: Premium SEO, navigation, search and accessibility regression
        run: node --test tests/premium.test.mjs tests/claims.test.mjs tests/external-writers.test.mjs tests/search-index.test.mjs tests/markdown-import.test.mjs tests/post-publish.test.mjs
      - name: Verify CNAME and canonical outputs
        shell: bash
        run: |
          test "$(cat CNAME)" = "global.rentbikehanoi.com"
          grep -q 'https://global.rentbikehanoi.com/sitemap.xml' robots.txt
          grep -q '<html lang="de"' de/index.html
          grep -q '<html lang="ko"' ko/index.html
          grep -q '<html lang="ja"' ja/index.html
      - name: Validate SEO matrix and live URL inventory
        run: node scripts/seo/validate-plan.mjs
      - name: Smoke test read-only German writer planning
        run: node scripts/seo/writer-queue.mjs --locale de --count 2
      - name: Validate 10-language navigation and footer
        run: node scripts/nav-qa.mjs
      - name: Read-only technical and AI Search audits
        run: |
          node scripts/seo/audit-static.mjs --out reports/technical-audit.json --fail-p0
          node scripts/seo/audit-ai-search.mjs --out reports/ai-search-audit.json
      - name: Autonomous SEO engineer (read-only QA and reports)
        run: node scripts/seo/engine.mjs --locale de --count 2
      - name: Archive audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-seo-review
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify public About and Contact and approved address
        shell: bash
        run: |
          test -f about/index.html
          test -f contact/index.html
          grep -q 'nguyentuantu8x@gmail.com' contact/index.html
          grep -q '<loc>https://global.rentbikehanoi.com/about/</loc>' sitemap.xml
          grep -q '<loc>https://global.rentbikehanoi.com/contact/</loc>' sitemap.xml
      - name: Synthetic metadata scalability smoke check (no network or HTML generation)
        run: node scripts/bench/search-scale.mjs
      - name: Test safe article rendering and refusal gates
        run: node --test tests/content-publisher.test.mjs
