name: Manual Writer Pack (no AI API)
on:
  workflow_dispatch:
    inputs:
      writer:
        description: "Select external writer lane"
        required: true
        type: choice
        options: [W1, W2, W3]
      count:
        description: "Preview pair size; NOT a claim"
        required: true
        type: choice
        default: "2"
        options: ["2"]
      locale:
        description: "Optional locale filter vi/en/de/fr/es/nl/zh/pt/ko/ja, blank for any"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: global-manual-writer-pack-${{ github.event.inputs.writer }}
  cancel-in-progress: false
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify topic ownership
        run: node --test tests/external-writers.test.mjs
      - name: Read-only shared pool preview (NOT a reservation)
        env:
          WRITER: ${{ inputs.writer }}
          COUNT: ${{ inputs.count }}
          LOCALE: ${{ inputs.locale }}
        run: |
          set -euo pipefail
          mkdir -p reports
          if [ -n "$LOCALE" ]; then
            node scripts/writer-pool.mjs next --writer "$WRITER" --locale "$LOCALE" > reports/writer-pack.json
          else
            node scripts/writer-pool.mjs next --writer "$WRITER" > reports/writer-pack.json
          fi
          echo "READ ONLY: dispatch Global Dynamic Writer Pool action=claim to reserve actual IDs."
          cat reports/writer-pack.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-writer-pack
          path: reports/writer-pack.json
          retention-days: 7
